apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml

namespace: alphamind-prod

namePrefix: prod-

patches:
  - target:
      kind: Deployment
      name: alphamind-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: production
  - target:
      kind: Deployment
      name: alphamind-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
  - target:
      kind: Ingress
      name: alphamind-ingress
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: alphamind.example.com
      - op: replace
        path: /spec/rules/0/host
        value: alphamind.example.com
  - target:
      kind: HorizontalPodAutoscaler
      name: alphamind-backend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 4
      - op: replace
        path: /spec/maxReplicas
        value: 20
  - target:
      kind: HorizontalPodAutoscaler
      name: alphamind-frontend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 4
      - op: replace
        path: /spec/maxReplicas
        value: 16
  - target:
      kind: ConfigMap
      name: alphamind-config
    patch: |-
      - op: replace
        path: /data/API_URL
        value: http://prod-alphamind-backend
      - op: replace
        path: /data/REDIS_HOST
        value: prod-alphamind-redis
      - op: replace
        path: /data/DATABASE_HOST
        value: prod-alphamind-database
      - op: replace
        path: /data/ALLOWED_ORIGINS
        value: https://alphamind.example.com
  - target:
      kind: Role
      name: alphamind-developer-role
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: alphamind-developer-role
